name: Atividade diária

on:
  schedule:
    - cron: "41 9 * * *"
    - cron: "13 12 * * *"
    - cron: "47 21 * * *"
    - cron: "19 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atividade-diaria
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Registrar atividade
        env:
          GIT_NAME: ${{ secrets.GIT_NAME }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
        run: |
          if [ -z "$GIT_NAME" ] || [ -z "$GIT_EMAIL" ]; then
            echo "Defina os secrets GIT_NAME e GIT_EMAIL no repositório."
            exit 1
          fi
          export TZ=America/Sao_Paulo
          HOJE=$(date +%Y-%m-%d)
          HORA=$(date +%-H)
          if [ "$HORA" -lt 15 ]; then TURNO="manhã"; else TURNO="noite"; fi
          ARQUIVO=.github/atividade.txt
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git pull --rebase --quiet origin main
          if grep -q "^$HOJE $TURNO " "$ARQUIVO" 2>/dev/null; then
            echo "A atividade de hoje ($TURNO) já foi registrada."
            exit 0
          fi
          echo "$HOJE $TURNO $(date +%H:%M) (Brasília)" >> "$ARQUIVO"
          tail -n 60 "$ARQUIVO" > "$ARQUIVO.tmp" && mv "$ARQUIVO.tmp" "$ARQUIVO"
          git add "$ARQUIVO"
          git commit -m "Atividade de $(date +%d/%m/%Y) ($TURNO)"
          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((tentativa * 15))
            git pull --rebase origin main
          done
          echo "Não foi possível enviar o commit depois de 3 tentativas."
          exit 1
